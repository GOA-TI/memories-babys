; Samuel Memorias — videos ~3 min, hasta 512 MB/archivo ( /etc/php/8.3/fpm/conf.d/99-samuel-uploads.ini )
; post_max_size: varios archivos en una publicación (p. ej. 4×512 MB).
upload_max_filesize = 512M
post_max_size = 2048M
max_execution_time = 900
max_input_time = 900
memory_limit = 768M
; Debe cubrir storage/framework/views (tempnam al compilar Blade) y subidas grandes.
upload_tmp_dir = /var/www/samuel-memorias/storage
sys_temp_dir = /var/www/samuel-memorias/storage
