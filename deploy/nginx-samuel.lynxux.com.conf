# Lynxux — Samuel Memorias (samuel.lynxux.com)
server {
    listen 80;
    listen [::]:80;
    server_name samuel.lynxux.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samuel.lynxux.com;

    ssl_certificate     /etc/letsencrypt/live/lynxux-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lynxux-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/samuel-memorias/public;
    index index.php;

    client_max_body_size 2048M;
    access_log /var/log/nginx/samuel-memorias-access.log;
    error_log  /var/log/nginx/samuel-memorias-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
